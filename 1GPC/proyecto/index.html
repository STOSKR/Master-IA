<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Long Long Way...</title>
</head>

<body>
  <canvas class="game"></canvas>

  <!-- Pantalla de inicio -->
  <div id="start-screen">
    <div class="start-content">
      <h1 class="game-title">LONG LONG WAY</h1>

      <div class="controls-display">
        <div class="control-item">
          <div class="key-button">▲</div>
          <div class="control-arrow">↑</div>
          <div class="control-label">Avanzar</div>
        </div>

        <div class="controls-row">
          <div class="control-item">
            <div class="key-button">◀</div>
            <div class="control-arrow">←</div>
            <div class="control-label">Izquierda</div>
          </div>

          <div class="control-item">
            <div class="key-button">▼</div>
            <div class="control-arrow">↓</div>
            <div class="control-label">Retroceder</div>
          </div>

          <div class="control-item">
            <div class="key-button">▶</div>
            <div class="control-arrow">→</div>
            <div class="control-label">Derecha</div>
          </div>
        </div>
      </div>

      <button id="start-button" class="start-btn">PRESIONA ESPACIO PARA JUGAR</button>
    </div>
  </div>

  <div id="controls">
    <div>
      <button id="forward">▲</button>
      <button id="left">◀</button>
      <button id="backward">▼</button>
      <button id="right">▶</button>
    </div>
  </div>
  <div id="weather-control">
    <button id="rain-toggle" title="Toggle Rain (F)">☔</button>
  </div>
  <div id="score">0</div>
  <div id="result-container">
    <div id="result">
      <h1>Good Game</h1>
      <p>Puntuación: <span id="final-score"></span></p>
      <button id="retry">Presiona R para reiniciar</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
